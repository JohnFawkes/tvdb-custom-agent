# TVDB custom metadata agent for Plex.
#
#   1. Put TVDB_API_KEY (and ADMIN_TOKEN, optionally TVDB_PIN) in a .env file next to this file.
#   2. mkdir -p data config
#   3. docker compose up -d
#
# Then add http://<this-host>:8000 (or http://tvdb-agent:8000 from a container on
# the same Docker network) to Plex as a metadata provider. See the README.

services:
  tvdb-agent:
    # Published by .github/workflows/docker.yml. Pin a release with TVDB_AGENT_TAG=1.2.3.
    image: ghcr.io/johnfawkes/tvdb-custom-agent:${TVDB_AGENT_TAG:-latest}
    # To build from a local checkout instead, uncomment:
    # build: .
    container_name: tvdb-agent
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"     # must be able to write ./data
    ports:
      - "${TVDB_AGENT_PORT:-8000}:8000"
    environment:
      TVDB_API_KEY: "${TVDB_API_KEY:?set TVDB_API_KEY in .env}"   # required
      TVDB_PIN: "${TVDB_PIN:-}"             # only for user-supported (subscriber) keys
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"       # protects /admin; strongly recommended
      # DEFAULT_LANGUAGE: "en"              # used when Plex does not send X-Plex-Language
      # DEFAULT_EPISODE_ORDER: "default"    # default | aired | dvd | absolute | ...
      # PUBLIC_URL: "http://192.168.1.10:8000"   # shown on the admin page
      # LOG_LEVEL: "DEBUG"                  # logs every request body Plex sends
    volumes:
      - ./data:/data                        # runtime per-show overrides (overrides.json)
      - ./config:/config                    # optional config.yaml (see config.example.yaml)
